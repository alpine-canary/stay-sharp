language: text
prompt: Your DLQ has held 214 messages for 9 days. Nobody knew. What was missing?
code: DLQ ─► 214 messages ─► (silence)
choices:
- A bigger DLQ
- More retries before the DLQ
- An alarm on DLQ depth above 0, a redrive procedure, and retention set to the 14-day maximum
- A shorter retention period
answer:
  choice: 2
explanation: Messages expire (4 days by default, 14 at most), and the clock keeps the original enqueue
  time. Without an alarm, a DLQ is where data goes to die quietly.
