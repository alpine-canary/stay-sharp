prompt: export.csv is 6 GB. The container has 2 GB of memory.
code: |-
  with open("export.csv") as f:
      lines = f.read().splitlines()
  for line in lines:
      load(line)
choices:
- Use f.readlines() instead
- Iterate over the file object (or csv.reader on it) so only one line is in memory at a time
- Compress the file
- Add swap space
answer:
  choice: 1
explanation: 'Stream it: for row in csv.reader(f). Memory stays flat whatever the file size. Then batch
  the loads (e.g. 1,000 rows per insert) for speed.'
