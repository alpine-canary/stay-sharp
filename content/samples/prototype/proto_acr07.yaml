prompt: Backups run every 24 hours; a restore takes 2 hours. Your RPO and RTO?
choices:
- RPO 2 h, RTO 24 h
- RPO up to 24 h, RTO about 2 h
- Both 26 h
- RPO 0, RTO 2 h
answer:
