id: sample_acronym_ttl
level: senior
deck: acronym
prompt: In DynamoDB, what does TTL do?
choices:
- Deletes items some time after a timestamp attribute has passed
- Limits how long a query may run
- Sets how long a connection stays open
- Caches items for a number of seconds
answer:
  choice: 0
explanation: Time to live. DynamoDB deletes expired items in the background, usually within a few
  days, so reads that depend on expiry must still compare the timestamp with now.
