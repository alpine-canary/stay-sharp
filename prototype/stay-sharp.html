<style>
/* Layout: one narrow column like a code-review pane. The question is the "diff", your pick is a yellow review flag, verdicts use review colours. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#141E30; --muted:#566377; --line:#D3D9E2;
  --accent:#2A49D4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FC;
  --flag:#E9B10F; --flag-soft:#FFF3C7;
  --good:#1B7A4B; --good-soft:#DCF2E6; --bad:#BE3328; --bad-soft:#FADFDB; --half:#9A6100; --half-soft:#FBEACB;
  --code-bg:#F5F7FA; --gutter:#8792A3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121B; --surface:#151C28; --ink:#E6EBF3; --muted:#98A4B6; --line:#283244;
  --accent:#8199FF; --accent-ink:#0D121B; --accent-soft:#1D2646;
  --flag:#F2C230; --flag-soft:#372F12;
  --good:#4CC28A; --good-soft:#143224; --bad:#FF7B6F; --bad-soft:#3B1B19; --half:#F0B44C; --half-soft:#382A11;
  --code-bg:#101722; --gutter:#677387; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121B; --surface:#151C28; --ink:#E6EBF3; --muted:#98A4B6; --line:#283244;
  --accent:#8199FF; --accent-ink:#0D121B; --accent-soft:#1D2646;
  --flag:#F2C230; --flag-soft:#372F12;
  --good:#4CC28A; --good-soft:#143224; --bad:#FF7B6F; --bad-soft:#3B1B19; --half:#F0B44C; --half-soft:#382A11;
  --code-bg:#101722; --gutter:#677387; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.mark i{width:14px;height:22px;background:var(--flag);border-radius:3px;display:block}
.chip{font:600 13px/1 var(--body);padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip b{font-family:var(--mono)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;min-width:0}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(40px,9vw,64px);font-weight:800;letter-spacing:-.02em}
.hero .sub{color:var(--muted)}
.tagline{font-family:var(--display);font-weight:600;font-size:19px}
.decks{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.decks li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.decks .n{font-family:var(--mono);color:var(--muted);font-size:13px}
.decks .d{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.grid14{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:grid;gap:6px}
.tile.today{border-color:var(--ink)}
.tile .t1{font:600 14px var(--mono)}
.tile .t2{font-size:12px;color:var(--muted)}
.sq{display:flex;gap:3px;min-height:10px}
.sq span{width:10px;height:10px;border-radius:2px;background:var(--line)}
.s1{background:var(--good)!important}.s05{background:var(--half)!important}.s0{background:var(--bad)!important}

.pips{display:flex;gap:6px}
.pip{flex:1;height:6px;border-radius:3px;background:var(--line)}
.pip.cur{background:var(--ink)}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtitle{font-size:22px;font-weight:600;font-family:var(--display);line-height:1.25}
.hint{color:var(--muted);font-size:14px}

.code{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font:13.5px/1.65 var(--mono);padding-block:8px}
.code .in{display:grid;min-width:max-content}
.ln{display:flex;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:0 14px 0 0;font:inherit;white-space:pre;cursor:pointer}
.ln:hover{background:var(--accent-soft)}
.ln .g{flex:none;width:2.8em;text-align:right;padding-right:12px;color:var(--gutter);user-select:none}
.ln[aria-pressed="true"]{background:var(--flag-soft);border-left-color:var(--flag)}
.ln.ok{background:var(--good-soft);border-left-color:var(--good)}
.ln.ko{background:var(--bad-soft);border-left-color:var(--bad)}
.ln[disabled]{cursor:default}
pre.flow{margin:0;padding:6px 16px;white-space:pre}

.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;line-height:1.45}
.opt .k{font:600 12px/1.9 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}

.fb{border-left:4px solid var(--line);background:var(--code-bg);padding:14px 16px;border-radius:0 10px 10px 0;display:grid;gap:8px}
.fb.v1{border-color:var(--good)}.fb.v05{border-color:var(--half)}.fb.v0{border-color:var(--bad)}
.fb .verdict{font-family:var(--display);font-weight:800;font-size:18px}
.v1 .verdict{color:var(--good)}.v05 .verdict{color:var(--half)}.v0 .verdict{color:var(--bad)}
.src{font-size:14px;color:var(--muted)}

.score{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline}
.score .big{font:800 56px/1 var(--display);font-variant-numeric:tabular-nums}
.score .lab{color:var(--muted);font-size:14px}
.share{font:14px/1.6 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin:0;user-select:all}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.recap li{display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.recap .sq1{width:12px;height:12px;border-radius:3px;background:var(--line);transform:translateY(1px)}
.recap .dk{color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:13px;text-align:center}
.toast{color:var(--good);font-size:14px;font-weight:600}
@media (prefers-reduced-motion: no-preference){.opt,.ln,.tile,.btn{transition:background-color .12s,border-color .12s}}
</style>

<script>
"use strict";
const START = "2026-10-23";
const DAYS = 14;
const DECKS = {
  spot:   { name: "Spot the bug",      desc: "Tap the worst line, say what's wrong" },
  better: { name: "Could do better",   desc: "Working code, one weakness" },
  fail:   { name: "What if it fails?", desc: "Twice, never, or five times" },
  acr:    { name: "Acronym or tool",   desc: "The words engineers use" },
  news:   { name: "AI this week",      desc: "Dated, with its source" }
};

/* ---------- Questions (answer = index in choices; spot questions also have lines) ---------- */
const SPOT = [
{ id:"spot01", lang:"python", lines:[4],
  code:String.raw`orders = json.load(open("orders.json"))
for order in orders:
    try:
        requests.post(URL, json=order)
        print("ok", order["id"])
    except Exception as e:
        print("failed", e)
print("All orders sent")`,
  choices:["requests doesn't raise on 4xx/5xx, so a 500 still prints \"ok\"","json.load can't read a top-level list","print() isn't safe inside a try block","The loop should use enumerate()"], answer:0,
  explain:"The worst defect is the one that lies: a rejected order counts as sent. Check the response (raise_for_status), add a timeout, an Idempotency-Key so a rerun doesn't duplicate orders, collect the failures and exit non-zero. Line 8 also says \"All orders sent\" whatever happened." },
{ id:"spot02", lang:"python", lines:[2,3],
  code:String.raw`def find_user(cur, email):
    sql = f"SELECT id, name FROM users WHERE email = '{email}'"
    cur.execute(sql)
    return cur.fetchone()`,
  choices:["fetchone() returns a list, not a row","SQL injection: the e-mail is pasted into the query text","f-strings are too slow for SQL","The e-mail should be lower-cased first"], answer:1,
  explain:"An e-mail like x' OR '1'='1 changes the query. Pass values as parameters: cur.execute(\"... WHERE email = %s\", (email,)). The driver escapes them, and the query plan can be reused." },
{ id:"spot03", lang:"python", lines:[2,4,5],
  code:String.raw`def total_with_vat(items):
    total = 0.0
    for it in items:
        total += it["price"] * it["qty"]
    return round(total * 1.081, 2)`,
  choices:["Swiss VAT is 7.7%, not 8.1%","round() needs 3 digits for francs","Money is held in binary floats, so amounts drift by fractions of a centime","items could be a tuple"], answer:2,
  explain:"0.1 + 0.2 != 0.3 in binary floats. Use Decimal (or integer centimes), round once with an explicit rule (ROUND_HALF_UP, 5 centimes in CHF), and keep the currency with every amount. Swiss standard VAT has been 8.1% since 2024." },
{ id:"spot04", lang:"python", lines:[5,6],
  code:String.raw`def handler(event, context):
    for record in event["Records"]:
        try:
            process(json.loads(record["body"]))
        except Exception:
            logger.exception("failed")
    return {"statusCode": 200}`,
  choices:["Failures are logged and swallowed: the batch counts as a success, SQS deletes it, failed messages never reach the DLQ","An SQS handler must return statusCode 202","json.loads should be json.load","logger.exception doesn't record the stack trace"], answer:0,
  explain:"A logged error isn't a handled error. Collect the failed messageIds and return {\"batchItemFailures\": [...]} (ReportBatchItemFailures), so only those return to the queue and, after maxReceiveCount, land in the DLQ with an alarm." },
{ id:"spot05", lang:"php", lines:[2],
  code:String.raw`$id = $db->insert('submissions', $data);
mail($to, '[New request]', $body);
http_response_code(200);
echo json_encode(['status' => 'sent', 'id' => $id]);`,
  choices:["http_response_code() must come before the insert","mail()'s return value is ignored, so the visitor sees \"sent\" even when no e-mail left","json_encode can't encode integers","mail() needs a fifth parameter"], answer:1,
  explain:"Silent mail failures can last weeks. At minimum check the result and log it; better, write the e-mail to an outbox table in the same transaction as the submission and send it from a job that retries and alerts." },
{ id:"spot06", lang:"python", lines:[2,6],
  code:String.raw`def fetch(url):
    while True:
        try:
            return requests.get(url, timeout=5).json()
        except requests.RequestException:
            continue`,
  choices:["timeout=5 is too long","It retries forever, instantly, with no limit and no backoff","You can't return .json() directly","requests.RequestException doesn't exist"], answer:1,
  explain:"During an outage this hammers the server and never gives up. Cap the attempts, use exponential backoff with jitter, retry only temporary errors (timeouts, 429, 5xx), then raise so the caller or the DLQ takes over." },
{ id:"spot07", lang:"typescript", lines:[2],
  code:String.raw`export const handler = async (event) => {
  console.log("event", JSON.stringify(event));
  const input = JSON.parse(event.body);
  const user = await createUser(input.email, input.password);
  return { statusCode: 201, body: JSON.stringify({ id: user.id }) };
};`,
  choices:["201 is the wrong status for a creation","JSON.parse must be awaited","It logs the whole request, password and personal data included, into CloudWatch","An async handler can't return an object"], answer:2,
  explain:"Logs are copied, exported and read by many people. Log ids and outcomes, never bodies, passwords, tokens or e-mails. Set a retention period on the log group too." },
{ id:"spot08", lang:"python", lines:[2,3,4],
  code:String.raw`def reserve_seat(db, event_id, user_id):
    taken = db.scalar("SELECT COUNT(*) FROM seats WHERE event_id = %s", event_id)
    if taken < 40:
        db.execute("INSERT INTO seats (event_id, user_id) VALUES (%s, %s)", event_id, user_id)
        return True
    return False`,
  choices:["The %s placeholders allow SQL injection","Two requests can both read 39 and both insert, so 41 seats get sold","COUNT(*) is slower than COUNT(id)","It should return the seat id"], answer:1,
  explain:"Read-then-write without a lock is a race. Lock the event row (SELECT ... FOR UPDATE in a transaction), or use a conditional write: UPDATE events SET seats_left = seats_left - 1 WHERE id = %s AND seats_left > 0, and check the affected row count. The placeholders are fine: they're parameters." },
{ id:"spot09", lang:"python", lines:[2,3],
  code:String.raw`def is_expired(contract):
    end = datetime.strptime(contract["end"], "%Y-%m-%d %H:%M")
    return datetime.now() > end`,
  choices:["strptime can't parse minutes","It should use >=","datetime.now() is deprecated","Naive datetimes: the server clock (often UTC) is compared with a Zurich local time, so contracts expire 1 to 2 hours off"], answer:3,
  explain:"Attach the zone: parse with ZoneInfo(\"Europe/Zurich\"), compare with datetime.now(timezone.utc). Store instants in UTC, show them in local time. In energy, delivery periods and DST changeovers make this a real money bug." },
{ id:"spot10", lang:"python", lines:[2],
  code:String.raw`s3 = boto3.client("s3")
resp = s3.list_objects_v2(Bucket="archive")
for obj in resp["Contents"]:
    backup(obj["Key"])`,
  choices:["list_objects_v2 returns at most 1,000 keys per call, so without a paginator the rest are silently skipped","It should use boto3.resource","The key field is lower-case \"key\"","Bucket names must be upper-case"], answer:0,
  explain:"Use s3.get_paginator(\"list_objects_v2\") and loop over the pages. Also: \"Contents\" is missing when the bucket is empty, so resp[\"Contents\"] raises KeyError." },
{ id:"spot11", lang:"php", lines:[2],
  code:String.raw`$expected = hash_hmac('sha256', $formId . $ts, $appKey);
if ($_POST['token'] == $expected) {
    accept_submission($_POST);
}`,
  choices:["SHA-256 is too weak for an HMAC","hash_hmac's arguments are in the wrong order","Compare with hash_equals(): == is loose and not constant-time","$_POST can't carry tokens"], answer:2,
  explain:"hash_equals() compares in constant time and without PHP's type juggling. Also check that $ts is recent and that the token is used once, or it can be replayed." },
{ id:"spot12", lang:"python", lines:[2],
  code:String.raw`def chunks(items, size):
    return [items[i:i + size] for i in range(0, len(items) - size, size)]`,
  choices:["Slicing copies the list, too slow","size must be a power of two","The range stops too early: 25 items in chunks of 10 gives 2 chunks and drops the last 5","A list comprehension can't return lists"], answer:2,
  explain:"range(0, 15, 10) yields 0 and 10 only. It should be range(0, len(items), size). The test that catches it: a length that isn't a multiple of size, and an exact multiple." },
{ id:"spot13", lang:"python", lines:[1],
  code:String.raw`def add_tag(tag, tags=[]):
    tags.append(tag)
    return tags`,
  choices:["The default list is created once and shared between calls, so tags leak from one call into the next","append returns None, so tags becomes None","tag must be a string","Lists aren't allowed as default arguments"], answer:0,
  explain:"Default values are evaluated once, when the function is defined. Use tags=None, then tags = [] if tags is None else tags." },
{ id:"spot14", lang:"python", lines:[3],
  code:String.raw`def handle_payment(msg):
    order = db.get_order(msg["order_id"])
    db.execute("UPDATE orders SET paid = paid + %s WHERE id = %s", msg["amount"], order.id)
    send_receipt(order.email)`,
  choices:["%s should be ?","send_receipt should run first","get_order should be in a try block","Not idempotent: if SQS delivers the message twice, the amount is added twice and two receipts go out"], answer:3,
  explain:"SQS is at-least-once. Record the payment by its payment id with a unique key (or a DynamoDB conditional write), add the amount only when that insert succeeds, and send the receipt from that same decision." }
];

const BETTER = [
{ id:"bet01", lang:"python", prompt:"2,000 bookings means 2,001 queries. The best improvement?",
  code:String.raw`bookings = db.query("SELECT * FROM bookings WHERE day = %s", day)
for b in bookings:
    hotel = db.query_one("SELECT name FROM hotels WHERE id = %s", b.hotel_id)
    print(b.ref, hotel.name)`,
  choices:["Fetch the hotels in one query: a JOIN, or WHERE id IN (...)","Put a cache in front of MySQL","Run the loop in 4 threads","Select only the name column"], answer:0,
  explain:"The N+1 pattern: one query for the list, then one per row. A JOIN returns everything in one round trip. Threads and caches hide the cost without removing it." },
{ id:"bet02", lang:"python", prompt:"It passes every test. What do you add first before production?",
  code:String.raw`def get_rates(hotel_id):
    r = requests.get(f"{SUPPLIER}/rates/{hotel_id}")
    r.raise_for_status()
    return r.json()`,
  choices:["A User-Agent header","A timeout, for example timeout=(3, 10)","Switch to urllib","Keep the JSON in a global variable"], answer:1,
  explain:"requests waits forever by default. One hung supplier blocks the worker, and the queue behind it piles up. Connect and read timeouts first, then retries with backoff." },
{ id:"bet03", lang:"python", prompt:"Retries with backoff: a good start. The main weakness?",
  code:String.raw`for attempt in range(5):
    try:
        return api.create_invoice(data)
    except Exception:
        time.sleep(2 ** attempt)`,
  choices:["The delay grows too fast","5 attempts is too few","It retries everything, including a 400 \"invalid data\" that will never succeed, then returns None silently","time.sleep wastes CPU"], answer:2,
  explain:"Retry only temporary failures (timeouts, 429, 5xx), add jitter, raise after the last attempt. And send an idempotency key: create_invoice may have succeeded just before the timeout." },
{ id:"bet04", lang:"python", prompt:"The error is re-raised: good. What makes the next incident faster to solve?",
  code:String.raw`def handle(msg):
    try:
        save(msg)
    except DbError as e:
        print("save failed", e)
        raise`,
  choices:["Print the whole message body","Log at DEBUG level","Remove the print, the stack trace is enough","A structured log with the message id and booking reference, and no personal data"], answer:3,
  explain:"At 2 a.m. you search logs by id. JSON logs with a correlation id (message id, booking ref) let you follow one item through every service. Ids, not content." },
{ id:"bet05", lang:"python", prompt:"This Lambda handles 50 requests a second. An easy improvement?",
  code:String.raw`def handler(event, context):
    s3 = boto3.client("s3")
    table = boto3.resource("dynamodb").Table("Bookings")
    ...`,
  choices:["Create the clients once, outside the handler, so warm invocations reuse them","Raise memory to 10 GB","Put the function in a VPC","Call S3 through API Gateway"], answer:0,
  explain:"Code outside the handler runs once per execution environment and is reused by warm invocations. Creating clients on every call adds latency and new connections." },
{ id:"bet06", lang:"python", prompt:"The contracts table has 3 million rows.",
  code:String.raw`rows = db.query("SELECT * FROM contracts")
active = [r for r in rows if r.status == "active" and r.customer_id == cid]`,
  choices:["Use a generator instead of a list","Filter in SQL (WHERE customer_id = %s AND status = 'active') with an index on customer_id","Sort the rows first","Dump the table to a file once a day"], answer:1,
  explain:"Let the database do what it's built for: filter with an index, return only what you need. Moving 3 million rows to Python for a handful is slow and memory-hungry." },
{ id:"bet07", lang:"python", prompt:"This is in a repository the whole team uses.",
  code:String.raw`client = anthropic.Anthropic(api_key="sk-ant-api03-...")`,
  choices:["Move the key to a .env file committed with the code","Base64-encode it","Rotate the key now, then read it at runtime from Secrets Manager or a deploy-time environment variable","Make the repository private"], answer:2,
  explain:"Once committed, a key lives in git history: rotate it first. On AWS, Bedrock needs no key at all: the function's IAM role grants access." },
{ id:"bet08", lang:"sql", prompt:"This runs for every incoming e-mail.",
  code:String.raw`SELECT id, status FROM bookings WHERE supplier_ref = 'NS-88412';
-- 2.8 million rows, 1.9 s`,
  choices:["Add LIMIT 1","Move to a bigger instance","Add an index on supplier_ref, ideally UNIQUE","Use SELECT * to warm the cache"], answer:2,
  explain:"Without an index MySQL scans every row. A unique index turns it into a lookup of a few milliseconds and also blocks duplicate references at the database." },
{ id:"bet09", lang:"python", prompt:"export.csv is 6 GB. The container has 2 GB of memory.",
  code:String.raw`with open("export.csv") as f:
    lines = f.read().splitlines()
for line in lines:
    load(line)`,
  choices:["Use f.readlines() instead","Iterate over the file object (or csv.reader on it) so only one line is in memory at a time","Compress the file","Add swap space"], answer:1,
  explain:"Stream it: for row in csv.reader(f). Memory stays flat whatever the file size. Then batch the loads (e.g. 1,000 rows per insert) for speed." },
{ id:"bet10", lang:"python", prompt:"40 suppliers, about 800 ms each: a search takes 32 seconds.",
  code:String.raw`results = []
for s in suppliers:
    results.append(s.search(query))`,
  choices:["Drop the 20 slowest suppliers","Cache every result forever","Use a faster CPU","Call them concurrently, with a concurrency limit and a timeout per call, and return what arrived in time"], answer:3,
  explain:"The calls wait on the network, not the CPU. Concurrent calls take about as long as the slowest one; the per-call timeout caps that; the limit protects small suppliers from being flooded." },
{ id:"bet11", lang:"python", prompt:"Two copies of this worker run, for availability.",
  code:String.raw`while True:
    jobs = db.query("SELECT * FROM jobs WHERE status = 'new'")
    for j in jobs:

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function prep(q){
  // deterministic shuffle so the right answer isn't always in the same place
  let seed = hash(q.id);
  const rnd = () => { seed = (Math.imul(seed,1103515245)+12345)>>>0; return seed/4294967296; };
  const opts = q.choices.map((t,i)=>({t, ok:i===q.answer}));
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return {...q, opts};
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function todayISO(){
  try { return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Zurich",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }
  catch(e){ return new Date().toISOString().slice(0,10); }
}
function addDays(iso,n){ const t=new Date(iso+"T12:00:00Z"); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
function dayNumber(iso){ const d=Math.round((Date.parse(iso+"T12:00:00Z")-Date.parse(START+"T12:00:00Z"))/864e5); return ((d%DAYS)+DAYS)%DAYS+1; }
function dayLabel(n){ const t=new Date(addDays(START,n-1)+"T12:00:00Z"); return t.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}); }
function daySet(n){ return [SPOT,BETTER,FAIL,ACR,NEWS].map(arr=>arr[n-1]).filter(Boolean).map(q=>ALL[q.id]); }
const cls = s => s===1?"s1":s===0.5?"s05":"s0";
const emoji = s => s===1?"🟩":s===0.5?"🟨":"🟥";
const fmtTime = secs => `${Math.floor(secs/60)}m${String(secs%60).padStart(2,"0")}s`;

/* ---------- storage (this browser only, prototype) ---------- */
const KEY = "staysharp.m0";
function load(){ try { const v=JSON.parse(localStorage.getItem(KEY)); if(v&&v.results) return v; } catch(e){} return {results:{}, missed:[]}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
let store = load();
function streak(){
  const dates = new Set(Object.values(store.results).map(r=>r.playedOn));
  let d = todayISO(); if(!dates.has(d)) d = addDays(d,-1);
  let n=0; while(dates.has(d)){ n++; d=addDays(d,-1); }
  return n;
}

/* ---------- state ---------- */
const app = document.getElementById("app");
let view = "home";
let run = null;     // {mode, day, qs, i, scores, start, pick:{line,choice}, checked}
let copied = false;

function startRun(mode, day, qs){
  run = {mode, day, qs, i:0, scores:[], start:Date.now(), pick:{line:null, choice:null}, checked:false};
  view = "play"; copied=false; render(); window.scrollTo(0,0);
}

/* ---------- views ---------- */
function header(){
  return `<div class="top">
    <button class="mark" data-act="home" aria-label="Stay Sharp, home"><i></i>Stay Sharp</button>
    <span class="chip">Streak <b>${streak()}</b> day${streak()===1?"":"s"}</span>
  </div>`;
}

function renderHome(){
  const today = dayNumber(todayISO());
  const res = store.results[today];
  const set = daySet(today);
  const decks = set.map((q,k)=>`<li><span class="n">${k+1}</span><span>${DECKS[q.deck].name}</span><span class="d">${DECKS[q.deck].desc}</span></li>`).join("");
  const done = res ? `
      <div class="row"><div class="sq" aria-label="Your result">${res.scores.map(s=>`<span class="${cls(s)}"></span>`).join("")}</div>
      <span class="hint">${res.score}/${res.scores.length} · ${fmtTime(res.secs)}</span></div>
      <div class="row"><button class="btn" data-act="result" data-day="${today}">See result and share</button>
      <button class="btn ghost" data-act="daily" data-day="${today}">Replay (not scored)</button></div>`
    : `<div class="row"><button class="btn" data-act="daily" data-day="${today}">Start today's set</button><span class="hint">${set.length} questions · about 5 minutes</span></div>`;
  const tiles = Array.from({length:DAYS},(_,k)=>{
    const n=k+1, r=store.results[n];
    return `<button class="tile${n===today?" today":""}" data-act="${r?"result":"daily"}" data-day="${n}">
      <span class="t1">#${n}</span><span class="t2">${dayLabel(n)}${n===today?" · today":""}</span>
      <span class="sq">${r?r.scores.map(s=>`<span class="${cls(s)}"></span>`).join(""):""}</span></button>`;
  }).join("");
  const missed = store.missed.filter(id=>ALL[id]);
  return `${header()}
  <section class="card hero">
    <span class="eyebrow">Daily #${today} · ${dayLabel(today)} · Senior</span>
    <h1>Agents write the code.</h1>
    <p class="tagline">Don't lose your touch.</p>
    <ol class="decks">${decks}</ol>
    ${done}
  </section>
  <section class="card">
    <div class="qhead"><h2 style="font-size:20px">Weak spots</h2><span class="hint">${missed.length} question${missed.length===1?"":"s"} to revisit</span></div>
    <p class="hint">Every question you miss or half-miss comes back here until you get it right.</p>
    <div class="row"><button class="btn ghost" data-act="practice" ${missed.length?"":"disabled"}>Practise what I missed</button></div>
  </section>
  <section class="card">
    <h2 style="font-size:20px">The first two weeks</h2>
    <div class="grid14">${tiles}</div>
  </section>
  <p class="foot">Prototype M0 · Senior level · progress is saved in this browser only</p>`;
}

function renderPlay(){
  const q = run.qs[run.i], p = run.pick, c = run.checked;
  const pips = run.qs.map((_,k)=>`<span class="pip ${k<run.i?cls(run.scores[k]):k===run.i?(c?cls(run.scores[k]):"cur"):""}"></span>`).join("");
  let code = "";
  if(q.code){
    if(q.deck==="spot"){
      code = `<div class="code" role="group" aria-label="Code, tap the worst line"><div class="in">${q.code.split("\n").map((l,k)=>{
        const n=k+1; let st="";
        if(c){ if(q.lines.includes(n)) st="ok"; else if(p.line===n) st="ko"; }
        return `<button class="ln ${st}" data-act="line" data-n="${n}" aria-pressed="${p.line===n}" ${c?"disabled":""}><span class="g">${n}</span>${esc(l)||" "}</button>`;
      }).join("")}</div></div>`;
    } else {
      code = `<div class="code"><pre class="flow">${esc(q.code)}</pre></div>`;
    }
  }
  const prompt = q.deck==="spot" ? "Tap the line with the worst defect, then say what's wrong." : q.prompt;
  const opts = q.opts.map((o,k)=>{
    let st=""; if(c){ if(o.ok) st="ok"; else if(p.choice===k) st="ko"; }
    return `<button class="opt ${st}" data-act="choice" data-n="${k}" aria-pressed="${p.choice===k}" ${c?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${esc(o.t)}</span></button>`;
  }).join("");
  const ready = p.choice!==null && (q.deck!=="spot" || p.line!==null);
  let foot;
  if(!c){
    foot = `<div class="row"><button class="btn" data-act="check" ${ready?"":"disabled"}>Check</button>${q.deck==="spot"&&p.line===null?'<span class="hint">Pick a line first</span>':""}</div>`;
  } else {
    const s = run.scores[run.i];
    let verdict = s===1?"Correct":s===0?"Not this time":(q.lines.includes(p.line)?"Right line, wrong reason":"Right reason, wrong line");
    const src = q.src ? `<p class="src">Source: <a href="${esc(q.src.url)}" target="_blank" rel="noopener">${esc(q.src.title)}</a> · ${esc(q.src.date)}</p>` : "";
    const last = run.i===run.qs.length-1;
    foot = `<div class="fb v${s===0.5?"05":s}" role="status"><span class="verdict">${verdict}</span><p>${esc(q.explain)}</p>${src}</div>
      <div class="row"><button class="btn" data-act="next">${last?"See my result":"Next question"}</button></div>`;
  }
  const label = run.mode==="daily" ? `Daily #${run.day}` : "Weak spots";
  return `${header()}
  <div class="pips" aria-label="Question ${run.i+1} of ${run.qs.length}">${pips}</div>
  <section class="card">
    <div class="qhead"><span class="eyebrow">${DECKS[q.deck].name}${q.lang&&q.lang!=="flow"?" · "+q.lang:""}</span><span class="hint">${label} · ${run.i+1}/${run.qs.length}</span></div>
    <p class="qtitle">${esc(prompt)}</p>
    ${code}
    <div class="opts">${opts}</div>
    ${foot}
  </section>`;
}

function shareText(n,res){
  return `Stay Sharp #${n} · Senior\n${res.scores.map(emoji).join("")}  ${res.score}/${res.scores.length} · ${fmtTime(res.secs)} · streak ${streak()}`;
}

function renderResult(n, res, qs, practice){
  const recap = qs.map((q,k)=>`<li><span class="sq1 ${cls(res.scores[k])}"></span><span><span class="dk">${DECKS[q.deck].name}</span><br>${esc(q.deck==="spot"?q.opts.find(o=>o.ok).t:q.prompt)}</span></li>`).join("");
  return `${header()}
  <section class="card">
    <span class="eyebrow">${practice?"Weak spots":"Daily #"+n+" · "+dayLabel(n)}</span>
    <div class="score"><div><div class="big">${res.score}/${res.scores.length}</div><div class="lab">score</div></div>
      <div><div class="big">${fmtTime(res.secs)}</div><div class="lab">time</div></div>
      ${practice?"":`<div><div class="big">${streak()}</div><div class="lab">day streak</div></div>`}</div>
    ${practice?"":`<pre class="share" id="share">${esc(shareText(n,res))}</pre>
    <div class="row"><button class="btn" data-act="copy">Copy result</button>${copied?'<span class="toast">Copied</span>':""}</div>`}
    <ol class="recap">${recap}</ol>
    <div class="row"><button class="btn ghost" data-act="home">Back to today</button></div>
  </section>`;
}

function render(){
  if(view==="home") app.innerHTML = renderHome();
  else if(view==="play") app.innerHTML = renderPlay();
  else if(view==="result"){
    if(run && run.mode==="practice") app.innerHTML = renderResult(0, run.res, run.qs, true);
    else { const n=run.day; app.innerHTML = renderResult(n, store.results[n], daySet(n), false); }
  }
}

/* ---------- actions ---------- */
function check(){
  const q=run.qs[run.i], p=run.pick;
  const choiceOk = q.opts[p.choice].ok;
  let s;
  if(q.deck==="spot"){ const lineOk=q.lines.includes(p.line); s = lineOk&&choiceOk?1:(lineOk||choiceOk?0.5:0); }
  else s = choiceOk?1:0;
  run.scores[run.i]=s; run.checked=true;
  const m = new Set(store.missed);
  if(s<1) m.add(q.id); else if(run.mode==="practice") m.delete(q.id);
  store.missed=[...m]; save();
  render();
}
function next(){
  if(run.i<run.qs.length-1){ run.i++; run.pick={line:null,choice:null}; run.checked=false; render(); window.scrollTo(0,0); return; }
  const secs = Math.round((Date.now()-run.start)/1000);
  const score = run.scores.reduce((a,b)=>a+b,0);
  const res = {scores:run.scores, score, secs, playedOn:todayISO()};
  if(run.mode==="daily" && !run.replay){ store.results[run.day]=res; save(); }
  run.res = res;
  if(run.mode==="daily" && run.replay){ run.mode="practice"; }
  view="result"; render(); window.scrollTo(0,0);
}

app.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act=b.dataset.act, n=Number(b.dataset.n), day=Number(b.dataset.day);
  if(act==="home"){ view="home"; run=null; render(); }
  else if(act==="daily"){ startRun("daily", day, daySet(day)); run.replay = !!store.results[day]; }
  else if(act==="result"){ run={mode:"daily", day}; view="result"; copied=false; render(); window.scrollTo(0,0); }
  else if(act==="practice"){ const qs=store.missed.filter(id=>ALL[id]).slice(0,10).map(id=>ALL[id]); if(qs.length) startRun("practice", 0, qs); }
  else if(act==="line"){ run.pick.line=n; render(); }
  else if(act==="choice"){ run.pick.choice=n; render(); }
  else if(act==="check"){ check(); }
  else if(act==="next"){ next(); }
  else if(act==="copy"){
    const text = document.getElementById("share").textContent;
    const done = ()=>{ copied=true; render(); };
    const fallback = ()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById("share")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(err){ fallback(); }
  }
});

document.addEventListener("keydown", e=>{
  if(view!=="play" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if(!run.checked && "ABCD".includes(k) && k.length===1 && "ABCD".indexOf(k) < run.qs[run.i].opts.length){ run.pick.choice="ABCD".indexOf(k); render(); }
  else if(e.key==="Enter" && !e.target.closest("button")){
    if(run.checked) next();
    else { const q=run.qs[run.i]; if(run.pick.choice!==null && (q.deck!=="spot"||run.pick.line!==null)) check(); }
  }
});

render();
</script>
