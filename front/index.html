<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay Sharp - a daily 5-minute game for developers</title>
    <meta
      name="description"
      content="Five questions a day to keep your judgement sharp while coding agents write the code. Free, no account."
    />
    <!-- Start GET /today while the script loads, so the home view needs no extra round trip
         (SC-007, W7). The client reads /today with the same request mode, so the browser can
         reuse this response. -->
    <!-- The fonts of the first screen, so its text paints in the first frame (FR-034). -->
    <link rel="preload" href="/node_modules/@fontsource/bricolage-grotesque/files/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/api/v1/today" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
