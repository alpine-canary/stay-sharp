<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1f33" media="(prefers-color-scheme: dark)" />
    <title>Stay Sharp - a daily 5-minute game for developers</title>
    <meta
      name="description"
      content="Five questions a day to keep your judgement sharp while coding agents write the code. Free, no account."
    />
    <!-- Link previews on LinkedIn, X and messaging apps: absolute URLs, the image is
         public/og.png (1200x630). og:url is removed from the other pages at prerender. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stay Sharp" />
    <meta property="og:title" content="Stay Sharp - a daily 5-minute game for developers" />
    <meta
      property="og:description"
      content="Five questions a day to keep your judgement sharp while coding agents write the code. Free, no account."
    />
    <meta property="og:url" content="https://stay-sharp.lumineth.com/" />
    <meta property="og:image" content="https://stay-sharp.lumineth.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stay Sharp: a daily 5-minute game for developers" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Start GET /today while the script loads, so the home view needs no extra round trip
         (SC-007, W7). The client reads /today with the same request mode, so the browser can
         reuse this response. -->
    <!-- The fonts of the first screen, so its text paints in the first frame (FR-034). -->
    <link rel="preload" href="/node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/api/v1/today" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
